<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社區美食團購</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-16">

    <!-- 頂部 Header -->
    <header class="bg-slate-800 text-white py-6 shadow-md">
        <div class="max-w-4xl mx-auto px-4 flex justify-between items-center">
            <div>
                <span class="bg-amber-500 text-slate-900 font-bold text-xs px-2.5 py-1 rounded">社區獨家回饋價</span>
                <h1 class="text-2xl sm:text-3xl font-bold mt-1 tracking-tight">社區美食團購</h1>
                <p class="text-slate-300 text-xs sm:text-sm mt-0.5">嚴選熱門排隊美食 ｜ 專屬社區免費直送 ｜ 取貨地點：社區管理室前</p>
            </div>
            <!-- 切換角色按鈕 -->
            <button onclick="toggleAdminView()" id="adminToggleBtn" class="bg-slate-700 hover:bg-slate-600 text-slate-100 text-xs px-3 py-2 rounded border border-slate-600 transition">
                團主登入
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">

        <!-- 住戶跟團下單區 (前台) -->
        <section class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
            <h2 class="text-xl font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100">我要跟團預購</h2>
            <form id="orderForm" class="space-y-5">
                
                <!-- 住戶資料 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">戶號-住戶姓名 *</label>
                        <input type="text" id="userName" required placeholder="格式範例：A棟-8樓-張先生" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-slate-500 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">聯絡電話 *</label>
                        <input type="tel" id="userPhone" required placeholder="格式範例：0912345678" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-slate-500 outline-none text-sm">
                    </div>
                </div>

                <!-- 複選多品項區 -->
                <div class="border-t border-slate-100 pt-4 space-y-4">
                    <label class="block text-sm font-semibold text-slate-700">選擇團購品項：</label>

                    <!-- 品項 1：鬆軟日式貝果 (多口味同時選購) -->
                    <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="flex items-center space-x-2">
                                    <p class="font-bold text-slate-800 text-base">鬆軟日式貝果</p>
                                    <span class="bg-rose-100 text-rose-700 text-xs px-2 py-0.5 rounded font-bold">烘焙金獎肯定</span>
                                </div>
                                <p class="text-xs text-slate-500 mt-1 leading-relaxed">
                                    採用日本進口麵粉與 18 小時低溫湯種熟成工法，呈現極致鬆軟且具 Q 彈咬勁的完美口感！榮獲年度團購美食金獎，熱銷突破十萬顆的人氣早餐首選。
                                </p>
                            </div>
                            <span class="text-sm font-bold text-slate-700 whitespace-nowrap ml-2">$45 / 個</span>
                        </div>
                        
                        <!-- 貝果多口味選購列表 -->
                        <div class="pt-2 border-t border-slate-200/60 grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <div class="flex items-center justify-between bg-white p-2 rounded border border-slate-200">
                                <span class="text-xs font-semibold text-slate-700">伯爵茶貝果</span>
                                <div class="flex items-center space-x-1">
                                    <button type="button" onclick="adjustBagelFlavor('earlgrey', -1)" class="w-6 h-6 bg-slate-100 border border-slate-300 rounded font-bold text-xs hover:bg-slate-200">-</button>
                                    <span id="qty_earlgrey" class="w-5 text-center font-bold text-xs">0</span>
                                    <button type="button" onclick="adjustBagelFlavor('earlgrey', 1)" class="w-6 h-6 bg-slate-100 border border-slate-300 rounded font-bold text-xs hover:bg-slate-200">+</button>
                                </div>
                            </div>
                            <div class="flex items-center justify-between bg-white p-2 rounded border border-slate-200">
                                <span class="text-xs font-semibold text-slate-700">藍莓乳酪貝果</span>
                                <div class="flex items-center space-x-1">
                                    <button type="button" onclick="adjustBagelFlavor('blueberry', -1)" class="w-6 h-6 bg-slate-100 border border-slate-300 rounded font-bold text-xs hover:bg-slate-200">-</button>
                                    <span id="qty_blueberry" class="w-5 text-center font-bold text-xs">0</span>
                                    <button type="button" onclick="adjustBagelFlavor('blueberry', 1)" class="w-6 h-6 bg-slate-100 border border-slate-300 rounded font-bold text-xs hover:bg-slate-200">+</button>
                                </div>
                            </div>
                            <div class="flex items-center justify-between bg-white p-2 rounded border border-slate-200">
                                <span class="text-xs font-semibold text-slate-700">經典原味貝果</span>
                                <div class="flex items-center space-x-1">
                                    <button type="button" onclick="adjustBagelFlavor('original', -1)" class="w-6 h-6 bg-slate-100 border border-slate-300 rounded font-bold text-xs hover:bg-slate-200">-</button>
                                    <span id="qty_original" class="w-5 text-center font-bold text-xs">0</span>
                                    <button type="button" onclick="adjustBagelFlavor('original', 1)" class="w-6 h-6 bg-slate-100 border border-slate-300 rounded font-bold text-xs hover:bg-slate-200">+</button>
                                </div>
                            </div>
                            <div class="flex items-center justify-between bg-white p-2 rounded border border-slate-200">
                                <span class="text-xs font-semibold text-slate-700">榛果巧克力貝果</span>
                                <div class="flex items-center space-x-1">
                                    <button type="button" onclick="adjustBagelFlavor('choco', -1)" class="w-6 h-6 bg-slate-100 border border-slate-300 rounded font-bold text-xs hover:bg-slate-200">-</button>
                                    <span id="qty_choco" class="w-5 text-center font-bold text-xs">0</span>
                                    <button type="button" onclick="adjustBagelFlavor('choco', 1)" class="w-6 h-6 bg-slate-100 border border-slate-300 rounded font-bold text-xs hover:bg-slate-200">+</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 品項 2：產地直送大湖草莓盒 -->
                    <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="flex items-center space-x-2">
                                    <p class="font-bold text-slate-800 text-base">產地直送大湖草莓盒 (300g)</p>
