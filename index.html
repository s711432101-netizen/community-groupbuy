<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社區美食團購網</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-16">
    <!-- 頂部導覽列 -->
    <header class="bg-slate-800 text-white py-5 shadow-md sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">社區美食團購網</h1>
                <p class="text-slate-300 text-xs mt-0.5">鄰里集單享優惠 · 社區嘉年華活動合作平台</p>
            </div>
            <div class="flex gap-2 bg-slate-700 p-1 rounded-lg">
                <button id="navBuyer" onclick="switchRole('buyer')" class="px-4 py-1.5 rounded-md text-sm font-semibold bg-white text-slate-900 shadow-sm transition">
                    住戶團購前台
                </button>
                <button id="navAdmin" onclick="switchRole('admin')" class="px-4 py-1.5 rounded-md text-sm font-semibold text-slate-200 hover:text-white transition">
                    團主管理後台
                </button>
            </div>
        </div>
    </header>

    <!-- ================= 住戶團購前台 ================= -->
    <main id="buyerView" class="max-w-5xl mx-auto px-4 mt-6 space-y-6">
        <!-- 活動橫幅說明 -->
        <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
            <div>
                <span class="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-0.5 rounded">社區嘉年華連動</span>
                <p class="text-sm text-slate-700 mt-1">已在抽獎機或競標台取得專屬代碼？結帳時於下方輸入即可折抵或認領得標商品！</p>
            </div>
            <a href="#wishlistSection" class="text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 px-3 py-2 rounded-lg shrink-0 transition">
                👇 前往許願池敲碗
            </a>
        </div>

        <!-- 本期開團商品列表 -->
        <section>
            <h2 class="text-lg font-bold text-slate-900 mb-3">本期開團美食</h2>
            <div id="productGrid" class="grid grid-cols-1 md:grid-cols-3 gap-5"></div>
        </section>

        <!-- 優惠代碼 / 競標認領與結帳區 -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-5">
            <h2 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-3">訂單明細與結帳</h2>

            <!-- 折扣碼 / 得標認領碼輸入框（已移除淺色提示字與 Gather Town 字樣） -->
            <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-2">
                <label for="promoInput" class="block text-sm font-bold text-slate-800">
                    優惠折扣碼 / 競標得標認領碼 <span class="text-xs font-normal text-slate-500">（於社區嘉年華取得）</span>
                </label>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="promoInput" class="flex-1 bg-white border border-slate-300 rounded-lg px-3.5 py-2 text-sm font-mono uppercase focus:outline-none focus:border-slate-600">
                    <button onclick="applyPromoCode()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold text-sm px-5 py-2 rounded-lg transition shrink-0">
                        套用代碼
                    </button>
                </div>
                <p id="promoFeedback" class="text-xs font-semibold hidden"></p>
            </div>

            <!-- 購物車清單 -->
            <div id="cartList" class="space-y-2 text-sm">
                <p class="text-slate-400 text-center py-4">目前尚未選購任何商品</p>
            </div>

            <!-- 金額統計 -->
            <div class="border-t border-slate-200 pt-4 space-y-1.5 text-sm">
                <div class="flex justify-between text-slate-600">
                    <span>商品小計</span>
                    <span id="subtotalText">$0</span>
                </div>
                <div id="discountRow" class="flex justify-between text-emerald-600 font-semibold hidden">
                    <span id="discountLabel">優惠折抵</span>
                    <span id="discountText">-$0</span>
                </div>
                <div class="flex justify-between text-lg font-extrabold text-slate-900 pt-2 border-t border-slate-100">
                    <span>應付總金額</span>
                    <span id="totalText">$0</span>
                </div>
            </div>

            <!-- 住戶資訊與送出 -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
                <input type="text" id="buyerName" placeholder="住戶姓名（例：陳小姐）" class="border border-slate-300 rounded-lg px-3.5 py-2 text-sm">
                <input type="text" id="buyerUnit" placeholder="棟別樓層（例：A棟 5樓）" class="border border-slate-300 rounded-lg px-3.5 py-2 text-sm">
                <button onclick="submitOrder()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded-lg text-sm shadow-sm transition">
                    確認送出團購單
                </button>
            </div>
        </section>

        <!-- 鄰里敲碗許願池 -->
        <section id="wishlistSection" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
            <div>
                <h2 class="text-lg font-bold text-slate-900">鄰里美食許願池</h2>
                <p class="text-xs text-slate-500 mt-0.5">想吃什麼團購美食？許願或幫鄰居的提案 +1 敲碗，集滿人氣下期優先開團！</p>
            </div>

            <div class="flex flex-col sm:flex-row gap-2">
                <input type="text" id="wishItemInput" placeholder="輸入想許願的美食名稱（例：嘉義福義軒蛋捲）" class="flex-1 border border-slate-300 rounded-lg px-3.5 py-2 text-sm">
                <input type="text" id="wishReasonInput" placeholder="推薦理由（選填）" class="flex-1 border border-slate-300 rounded-lg px-3.5 py-2 text-sm">
                <button onclick="addWishItem()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold text-sm px-5 py-2 rounded-lg transition shrink-0">
                    我要許願
                </button>
            </div>

            <div id="wishlistContainer" class="divide-y divide-slate-100"></div>
        </section>
    </main>

    <!-- ================= 團主管理後台 ================= -->
    <main id="adminView" class="hidden max-w-5xl mx-auto px-4 mt-6 space-y-6">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs text-slate-500">累計成立訂單數</p>
                <p id="statOrders" class="text-2xl font-extrabold text-slate-900 mt-1">0 筆</p>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs text-slate-500">團購總營收金額</p>
                <p id="statRevenue" class="text-2xl font-extrabold text-emerald-600 mt-1">$0</p>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs text-slate-500">許願池最高人氣提案</p>
                <p id="statTopWish" class="text-base font-bold text-amber-600 mt-1.5 truncate">尚無資料</p>
            </div>
        </div>

        <!-- AI 採購與開團分析建議 -->
        <section class="bg-slate-800 text-white rounded-xl p-6 shadow-sm space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="text-base font-bold flex items-center gap-2">🤖 AI 智慧採購與下期開團決策分析</h2>
                <button onclick="renderAdmin()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded">重新分析</button>
            </div>
            <div id="aiInsightBox" class="text-sm text-slate-200 leading-relaxed bg-slate-900/60 p-4 rounded-lg border border-slate-700"></div>
        </section>

        <!-- 訂單明細管理 -->
        <section class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-900">住戶訂單總表</h2>
                <button onclick="clearDemoData()" class="text-xs text-rose-600 hover:underline">重置展示資料</button>
            </div>
            <div id="adminOrderList" class="divide-y divide-slate-100 text-sm"></div>
        </section>
    </main>

    <script>
        const PRODUCTS = [
            { id: 'p1', name: '法式手工可麗露禮盒 (6入)', price: 360, target: 20, sold: 16, tag: '本週熱銷' },
            { id: 'p2', name: '台南老字號手炒黑糖鮮奶露', price: 140, target: 30, sold: 27, tag: '即將成團' },
            { id: 'p3', name: '北海道十勝生乳捲 (原味)', price: 320, target: 15, sold: 11, tag: '社區口碑' }
        ];

        let cart = {};
        let appliedDiscount = 0;
        let appliedPromoCode = '';
        let wonAuctionItem = null;

        let orders = JSON.parse(localStorage.getItem('gb_orders')) || [];
        let wishlist = JSON.parse(localStorage.getItem('gb_wishlist')) || [
            { id: 'w1', name: '彰化不二坊蛋黃酥 (6入盒裝)', reason: '中秋快到了想先幫家人訂', votes: 14, isMine: false },
            { id: 'w2', name: '基隆廟口手工營養三明治', reason: '下午茶點心超適合', votes: 9, isMine: false }
        ];
        let votedWishIds = JSON.parse(localStorage.getItem('gb_voted_wishes')) || [];

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = PRODUCTS.map(p => {
                const pct = Math.min(100, Math.round((p.sold / p.target) * 100));
                return `
                <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm flex flex-col justify-between space-y-4">
                    <div>
                        <span class="bg-slate-100 text-slate-700 text-xs font-bold px-2.5 py-0.5 rounded">${p.tag}</span>
                        <h3 class="text-base font-bold text-slate-900 mt-2">${p.name}</h3>
                        <p class="text-xl font-extrabold text-slate-900 mt-1">$${p.price}</p>
                        <div class="mt-3">
                            <div class="flex justify-between text-xs text-slate-500 mb-1">
                                <span>成團進度：${p.sold} / ${p.target} 份</span>
                                <span class="font-bold text-slate-700">${pct}%</span>
                            </div>
                            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                <div class="bg-slate-800 h-full rounded-full" style="width: ${pct}%"></div>
                            </div>
                        </div>
                    </div>
                    <button onclick="addToCart('${p.id}')" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 rounded-lg text-sm transition">
                        + 加入團購單
                    </button>
                </div>`;
            }).join('');
        }

        function addToCart(pid) {
            cart[pid] = (cart[pid] || 0) + 1;
            renderCart();
        }

        function updateQty(pid, delta) {
            if (!cart[pid]) return;
            cart[pid] += delta;
            if (cart[pid] <= 0) delete cart[pid];
            renderCart();
        }

        function applyPromoCode() {
            const raw = document.getElementById('promoInput').value.trim().toUpperCase();
            const fb = document.getElementById('promoFeedback');
            fb.classList.remove('hidden', 'text-emerald-600', 'text-rose-600');

            if (raw.startsWith('GB')) {
                const amount = parseInt(raw.replace('GB', ''), 10) || 50;
                appliedDiscount = amount;
                appliedPromoCode = raw;
                fb.textContent = `🎉 驗證成功！已套用折價券【${raw}】，結帳現折 $${amount}。`;
                fb.classList.add('text-emerald-600');
            } else if (raw.startsWith('BID-')) {
                const bidPrice = parseInt(raw.replace('BID-', ''), 10) || 180;
                wonAuctionItem = { name: '限量大湖草莓起司塔 (特選版)', price: bidPrice, code: raw };
                fb.textContent = `🎉 驗證成功！已自動加入【限量大湖草莓起司塔（競標得標價 $${bidPrice}）】至訂單明細。`;
                fb.classList.add('text-emerald-600');
            } else {
                fb.textContent = '❌ 無效的代碼格式，請確認是否為社區嘉年華取得之代碼。';
                fb.classList.add('text-rose-600');
            }
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cartList');
            const entries = Object.entries(cart);
            let subtotal = 0;
            let html = '';

            if (wonAuctionItem) {
                subtotal += wonAuctionItem.price;
                html += `
                <div class="flex justify-between items-center bg-amber-50 border border-amber-200 p-3 rounded-lg">
                    <div>
                        <span class="bg-amber-500 text-white text-xs font-bold px-2 py-0.5 rounded mr-1.5">社區嘉年華 競標得標</span>
                        <span class="font-bold text-slate-900">${wonAuctionItem.name}</span>
                    </div>
                    <span class="font-bold text-slate-900">$${wonAuctionItem.price}</span>
                </div>`;
            }

            entries.forEach(([pid, qty]) => {
                const prod = PRODUCTS.find(p => p.id === pid);
                const itemTotal = prod.price * qty;
                subtotal += itemTotal;
                html += `
                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-lg border border-slate-100">
                    <div>
                        <span class="font-bold text-slate-800">${prod.name}</span>
                        <span class="text-xs text-slate-500 ml-2">$${prod.price} / 份</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="updateQty('${pid}', -1)" class="w-6 h-6 bg-white border border-slate-300 rounded font-bold text-slate-700">-</button>
                        <span class="w-6 text-center font-bold">${qty}</span>
                        <button onclick="updateQty('${pid}', 1)" class="w-6 h-6 bg-white border border-slate-300 rounded font-bold text-slate-700">+</button>
                        <span class="w-16 text-right font-bold text-slate-900">$${itemTotal}</span>
                    </div>
                </div>`;
            });

            list.innerHTML = html || '<p class="text-slate-400 text-center py-4">目前尚未選購任何商品</p>';

            const discountRow = document.getElementById('discountRow');
            let finalTotal = subtotal;
            if (appliedDiscount > 0 && subtotal > 0) {
                discountRow.classList.remove('hidden');
                document.getElementById('discountLabel').textContent = `優惠折抵 (${appliedPromoCode})`;
                document.getElementById('discountText').textContent = `-$${appliedDiscount}`;
                finalTotal = Math.max(0, subtotal - appliedDiscount);
            } else {
                discountRow.classList.add('hidden');
            }

            document.getElementById('subtotalText').textContent = `$${subtotal}`;
            document.getElementById('totalText').textContent = `$${finalTotal}`;
        }

        function submitOrder() {
            const name = document.getElementById('buyerName').value.trim();
            const unit = document.getElementById('buyerUnit').value.trim();
            if (!name || !unit) return alert('請填寫住戶姓名與棟別樓層！');
            if (Object.keys(cart).length === 0 && !wonAuctionItem) return alert('購物車還是空的喔！');

            const items = [];
            if (wonAuctionItem) items.push(`${wonAuctionItem.name} (競標得標) x1`);
            Object.entries(cart).forEach(([pid, qty]) => {
                const prod = PRODUCTS.find(p => p.id === pid);
                items.push(`${prod.name} x${qty}`);
            });

            const total = parseInt(document.getElementById('totalText').textContent.replace('$', ''), 10);
            orders.unshift({
                id: 'ORD-' + Date.now().toString().slice(-4),
                name, unit, items, total,
                promo: appliedPromoCode || (wonAuctionItem ? wonAuctionItem.code : '無'),
                time: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })
            });
            localStorage.setItem('gb_orders', JSON.stringify(orders));

            cart = {};
            appliedDiscount = 0;
            appliedPromoCode = '';
            wonAuctionItem = null;
            document.getElementById('promoInput').value = '';
            document.getElementById('promoFeedback').classList.add('hidden');
            renderCart();
            alert(`✅ 訂單已成功送出！感謝 ${name} (${unit}) 參與團購。`);
        }

        function addWishItem() {
            const name = document.getElementById('wishItemInput').value.trim();
            const reason = document.getElementById('wishReasonInput').value.trim() || '鄰居許願推薦';
            if (!name) return alert('請輸入想許願的美食名稱！');

            const newId = 'w-' + Date.now();
            // 標記 isMine: true，代表住戶自己剛許願的項目
            wishlist.unshift({ id: newId, name, reason, votes: 1, isMine: true });
            votedWishIds.push(newId);
            localStorage.setItem('gb_wishlist', JSON.stringify(wishlist));
            localStorage.setItem('gb_voted_wishes', JSON.stringify(votedWishIds));

            document.getElementById('wishItemInput').value = '';
            document.getElementById('wishReasonInput').value = '';
            renderWishlist();
        }

        function voteWish(wid) {
            if (votedWishIds.includes(wid)) return;
            const item = wishlist.find(w => w.id === wid);
            if (item) {
                item.votes += 1;
                votedWishIds.push(wid);
                localStorage.setItem('gb_wishlist', JSON.stringify(wishlist));
                localStorage.setItem('gb_voted_wishes', JSON.stringify(votedWishIds));
                renderWishlist();
            }
        }

        function renderWishlist() {
            const container = document.getElementById('wishlistContainer');
            const sorted = [...wishlist].sort((a, b) => b.votes - a.votes);
            container.innerHTML = sorted.map(w => {
                const hasVoted = votedWishIds.includes(w.id);
                let actionHtml = '';
                if (w.isMine) {
                    // 住戶自己許願的項目：不顯示「已敲碗」按鈕
                    actionHtml = `<span class="px-3.5 py-1.5 rounded-lg text-xs font-bold bg-amber-50 text-amber-800 border border-amber-200">🌟 我的許願 (${w.votes})</span>`;
                } else if (hasVoted) {
                    actionHtml = `<button disabled class="px-3.5 py-1.5 rounded-lg text-xs font-bold bg-slate-200 text-slate-600 cursor-not-allowed">✅ 已敲碗 (${w.votes})</button>`;
                } else {
                    actionHtml = `<button onclick="voteWish('${w.id}')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold bg-amber-100 hover:bg-amber-200 text-amber-900 transition">🥣 +1 敲碗 (${w.votes})</button>`;
                }

                return `
                <div class="py-3.5 flex items-center justify-between gap-4">
                    <div>
                        <p class="font-bold text-slate-900 text-sm">${w.name}</p>
                        <p class="text-xs text-slate-500 mt-0.5">${w.reason}</p>
                    </div>
                    ${actionHtml}
                </div>`;
            }).join('');
        }

        function switchRole(role) {
            const buyerView = document.getElementById('buyerView');
            const adminView = document.getElementById('adminView');
            const navBuyer = document.getElementById('navBuyer');
            const navAdmin = document.getElementById('navAdmin');

            if (role === 'buyer') {
                buyerView.classList.remove('hidden');
                adminView.classList.add('hidden');
                navBuyer.className = 'px-4 py-1.5 rounded-md text-sm font-semibold bg-white text-slate-900 shadow-sm transition';
                navAdmin.className = 'px-4 py-1.5 rounded-md text-sm font-semibold text-slate-200 hover:text-white transition';
            } else {
                buyerView.classList.add('hidden');
                adminView.classList.remove('hidden');
                navAdmin.className = 'px-4 py-1.5 rounded-md text-sm font-semibold bg-white text-slate-900 shadow-sm transition';
                navBuyer.className = 'px-4 py-1.5 rounded-md text-sm font-semibold text-slate-200 hover:text-white transition';
                renderAdmin();
            }
        }

        function renderAdmin() {
            document.getElementById('statOrders').textContent = `${orders.length} 筆`;
            const rev = orders.reduce((sum, o) => sum + o.total, 0);
            document.getElementById('statRevenue').textContent = `$${rev}`;

            const topWish = [...wishlist].sort((a, b) => b.votes - a.votes)[0];
            document.getElementById('statTopWish').textContent = topWish ? `${topWish.name} (${topWish.votes} 票)` : '尚無資料';

            const aiBox = document.getElementById('aiInsightBox');
            aiBox.innerHTML = `
                <p>• <strong>庫存與成團預警：</strong>「台南老字號手炒黑糖鮮奶露」已達 90% 成團門檻（27/30 份），建議發送社區公告提醒最後 3 份名額，預計今日即可向廠商下單。</p>
                <p class="mt-1.5">• <strong>下期選品推薦：</strong>根據鄰里許願池數據，<strong>「${topWish ? topWish.name : '彰化不二坊蛋黃酥'}」</strong>累積最高需求度（${topWish ? topWish.votes : 14} 人集氣），建議列為下週首選開團品項，預估首波可創下 25 份以上訂單。</p>
            `;

            const list = document.getElementById('adminOrderList');
            if (orders.length === 0) {
                list.innerHTML = '<p class="text-slate-400 py-4 text-center">目前尚無住戶訂單紀錄</p>';
            } else {
                list.innerHTML = orders.map(o => `
                <div class="py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                    <div>
                        <span class="font-mono text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-600">${o.id}</span>
                        <span class="font-bold text-slate-900 ml-1">${o.name}</span>
                        <span class="text-xs text-slate-500">(${o.unit} · ${o.time})</span>
                        <p class="text-xs text-slate-600 mt-1">${o.items.join('、')}</p>
                    </div>
                    <div class="text-right">
                        <span class="text-xs bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded font-mono">代碼: ${o.promo}</span>
                        <p class="font-extrabold text-slate-900 mt-0.5">$${o.total}</p>
                    </div>
                </div>`).join('');
            }
        }

        function clearDemoData() {
            if (confirm('確定要清除所有測試訂單與許願紀錄並恢復預設值嗎？')) {
                localStorage.removeItem('gb_orders');
                localStorage.removeItem('gb_wishlist');
                localStorage.removeItem('gb_voted_wishes');
                location.reload();
            }
        }

        renderProducts();
        renderCart();
        renderWishlist();
    </script>
</body>
</html>
