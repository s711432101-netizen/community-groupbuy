<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社區好物團購與到貨通知助手</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-16">

    <!-- 頂部資訊區 -->
    <header class="bg-slate-800 text-white py-8 shadow-md">
        <div class="max-w-4xl mx-auto px-4">
            <div class="flex items-center space-x-2">
                <span class="bg-slate-700 text-slate-200 text-xs px-3 py-1 rounded font-medium">社區限時專案</span>
                <span class="text-xs bg-slate-600 text-slate-200 px-2 py-1 rounded">廠商專屬團購價</span>
            </div>
            <h1 class="text-3xl font-bold mt-2 tracking-tight">全台名店巡禮 - 熱門美食社區團購</h1>
            <p class="text-slate-300 text-sm mt-1">取貨地點：社區管理室前 ｜ 廠商談定固定優惠價，團主統一集單向廠商訂購</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">

        <!-- 住戶跟團下單區 -->
        <section class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
            <h2 class="text-xl font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100">我要跟團預購</h2>
            <form id="orderForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">住戶姓名 / 戶號 *</label>
                        <input type="text" id="userName" required placeholder="例：A棟 8樓 張先生" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-slate-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">聯絡電話 *</label>
                        <input type="tel" id="userPhone" required placeholder="例：0912-345678" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-slate-500 outline-none">
                    </div>
                </div>

                <!-- 品項選購與算價機 -->
                <div class="border-t border-slate-100 pt-4 space-y-3">
                    <label class="block text-sm font-semibold text-slate-700">選擇團購品項：</label>
                    
                    <!-- 主商品 -->
                    <div class="flex justify-between items-center bg-slate-50 p-4 rounded-lg border border-slate-200">
                        <div>
                            <p class="font-bold text-slate-800 text-base">主打好物：全台排隊名店 - 嚴選爆漿禮盒</p>
                            <p class="text-xs text-slate-500 mt-0.5">專屬團購優惠價：$280 / 件 (原價 $350)</p>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button type="button" onclick="adjustQty(-1)" class="w-8 h-8 rounded bg-white text-slate-800 font-bold shadow-sm hover:bg-slate-100 border border-slate-300">-</button>
                            <span id="orderQty" class="font-bold text-lg w-6 text-center text-slate-800">1</span>
                            <button type="button" onclick="adjustQty(1)" class="w-8 h-8 rounded bg-white text-slate-800 font-bold shadow-sm hover:bg-slate-100 border border-slate-300">+</button>
                        </div>
                    </div>

                    <!-- 限量加購品 -->
                    <div class="flex justify-between items-center bg-slate-50 p-3.5 rounded-lg border border-slate-200">
                        <div class="flex items-center space-x-2">
                            <input type="checkbox" id="addOption" onchange="updateUI()" class="w-4 h-4 text-slate-600 rounded focus:ring-slate-500">
                            <label for="addOption" class="text-sm font-medium text-slate-700 cursor-pointer">
                                限量加購：專屬質感保冷袋 (+ $50 / 個)
                            </label>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">偏好取貨時段</label>
                        <select id="pickupTime" class="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-slate-500">
                            <option>平日傍晚 17:00 - 19:00 (下班第1波)</option>
                            <option>平日晚間 19:00 - 21:00 (下班第2波)</option>
                            <option>週末全天 (管理室代收領取)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">到貨通知管道</label>
                        <select id="notifyType" class="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-slate-500">
                            <option value="SMS 簡訊">SMS 簡訊通知</option>
                            <option value="LINE 群組">LINE 社區群組私訊</option>
                            <option value="電話語音">管理員電話通知</option>
                        </select>
                    </div>
                </div>

                <div class="bg-slate-100 p-4 rounded-lg flex justify-between items-center text-sm border border-slate-200">
                    <span class="text-slate-600">固定團購單價：<strong class="text-slate-800 font-bold">$280</strong> / 件</span>
                    <span class="text-slate-700">預估跟團總額：<strong id="totalPricePreview" class="text-slate-900 text-2xl font-bold">$280</strong> 元</span>
                </div>

                <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-lg shadow transition">
                    確認跟團預購
                </button>
            </form>
        </section>

        <!-- 鄰居評價與心得分享牆 -->
        <section class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
            <h2 class="text-xl font-bold text-slate-900 mb-3 pb-2 border-b border-slate-100">鄰居評價與心得分享牆</h2>
            
            <form id="reviewForm" onsubmit="addReview(event)" class="space-y-3 mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input type="text" id="reviewName" required placeholder="您的暱稱 / 戶號 (例：C棟 媽媽)" class="border border-slate-300 rounded p-2 text-sm outline-none focus:ring-2 focus:ring-slate-500">
                    <select id="reviewRating" class="border border-slate-300 rounded p-2 text-sm outline-none focus:ring-2 focus:ring-slate-500">
                        <option value="5">評分：5 顆星 (非常推薦)</option>
                        <option value="4">評分：4 顆星 (滿意)</option>
                        <option value="3">評分：3 顆星 (普通)</option>
                    </select>
                </div>
                <textarea id="reviewText" required rows="2" placeholder="撰寫品嚐心得或開箱評價，提供鄰居跟團參考..." class="w-full border border-slate-300 rounded p-2 text-sm outline-none focus:ring-2 focus:ring-slate-500"></textarea>
                <button type="submit" class="bg-slate-700 hover:bg-slate-800 text-white font-bold px-4 py-2 rounded text-sm transition">
                    發布評價
                </button>
            </form>

            <div id="reviewsList" class="space-y-3 max-h-60 overflow-y-auto">
                <!-- 動態渲染評價 -->
            </div>
        </section>

        <!-- 團主後台與物流管理區 -->
        <section class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
            <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3 mb-4 pb-2 border-b border-slate-100">
                <h2 class="text-xl font-bold text-slate-900">跟團名單與團主物流管理台</h2>
                <button onclick="copyLineSummary()" class="bg-slate-700 hover:bg-slate-800 text-white text-xs font-bold px-4 py-2.5 rounded shadow-sm transition">
                    一鍵複製 LINE 廣播格式
                </button>
            </div>

            <!-- 總量統計卡片 -->
            <div class="grid grid-cols-2 gap-4 mb-4 text-center">
                <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                    <p class="text-xs text-slate-500 font-semibold">社區訂購總份數</p>
                    <p id="statTotalQty" class="text-2xl font-bold text-slate-800 mt-1">0 件</p>
                </div>
                <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                    <p class="text-xs text-slate-500 font-semibold">團購累積總金額</p>
                    <p id="statTotalPrice" class="text-2xl font-bold text-slate-800 mt-1">$0 元</p>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-100 text-slate-800 border-b border-slate-200">
                            <th class="p-3 font-semibold">跟團住戶</th>
                            <th class="p-3 font-semibold">數量 / 加購</th>
                            <th class="p-3 font-semibold">應付金額</th>
                            <th class="p-3 font-semibold">通知管道</th>
                            <th class="p-3 font-semibold">狀態標記與發送通知</th>
                            <th class="p-3 font-semibold">操作</th>
                        </tr>
                    </thead>
                    <tbody id="orderTableBody" class="divide-y divide-slate-100">
                        <!-- 動態渲染訂單 -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const UNIT_PRICE = 280;

        // 預設資料
        let orders = JSON.parse(localStorage.getItem('community_groupbuy_orders')) || [
            { id: 1, name: 'B棟 5樓 陳小姐', phone: '0911222333', qty: 2, hasAddon: true, time: '平日傍晚 17:00 - 19:00', notify: 'LINE 群組', paid: true, picked: false },
            { id: 2, name: 'A棟 12樓 林先生', phone: '0988777666', qty: 3, hasAddon: false, time: '平日晚間 19:00 - 21:00', notify: 'SMS 簡訊', paid: false, picked: false }
        ];

        let reviews = JSON.parse(localStorage.getItem('community_groupbuy_reviews')) || [
            { name: 'C棟 3樓 媽媽', rating: '5', text: '這家爆漿禮盒上次買過非常滿意，這次回購兩件給家人吃！' },
            { name: 'A棟 主委', rating: '4', text: '口感不錯，包裝也很精緻，推薦大家跟團。' }
        ];

        let currentQty = 1;

        function adjustQty(amount) {
            currentQty = Math.max(1, currentQty + amount);
            document.getElementById('orderQty').innerText = currentQty;
            updateUI();
        }

        function updateUI() {
            const hasAddon = document.getElementById('addOption').checked;
            const estimatedTotal = (currentQty * UNIT_PRICE) + (hasAddon ? 50 : 0);
            document.getElementById('totalPricePreview').innerText = `$${estimatedTotal}`;

            // 計算統計總量
            const totalQty = orders.reduce((sum, order) => sum + order.qty, 0);
            const totalPrice = orders.reduce((sum, order) => sum + (order.qty * UNIT_PRICE) + (order.hasAddon ? 50 : 0), 0);

            document.getElementById('statTotalQty').innerText = `${totalQty} 件`;
            document.getElementById('statTotalPrice').innerText = `$${totalPrice} 元`;

            // 渲染表格
            const tbody = document.getElementById('orderTableBody');
            tbody.innerHTML = '';

            orders.forEach(order => {
                const orderPrice = (order.qty * UNIT_PRICE) + (order.hasAddon ? 50 : 0);
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition';
                tr.innerHTML = `
                    <td class="p-3 font-semibold text-slate-800">
                        ${order.name}
                        <br><span class="text-xs text-slate-400 font-normal">${order.phone}</span>
                    </td>
                    <td class="p-3 font-bold text-slate-700">
                        ${order.qty} 件 ${order.hasAddon ? '<span class="text-xs bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded font-normal ml-1">+保冷袋</span>' : ''}
                    </td>
                    <td class="p-3 text-slate-800 font-bold">$${orderPrice}</td>
                    <td class="p-3 text-xs text-slate-500">${order.notify || 'SMS 簡訊'}</td>
                    <td class="p-3 space-x-1 space-y-1">
                        <button onclick="toggleStatus(${order.id}, 'paid')" class="px-2 py-1 text-xs font-bold rounded ${order.paid ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-700'}">
                            ${order.paid ? '已付款' : '未付款'}
                        </button>
                        <button onclick="toggleStatus(${order.id}, 'picked')" class="px-2 py-1 text-xs font-bold rounded ${order.picked ? 'bg-sky-100 text-sky-800' : 'bg-slate-200 text-slate-600'}">
                            ${order.picked ? '已領貨' : '待領貨'}
                        </button>
                        <button onclick="sendArrivalNotice('${order.name}', '${order.notify || 'SMS 簡訊'}')" class="px-2 py-1 text-xs bg-slate-200 text-slate-800 hover:bg-slate-300 rounded font-medium transition">
                            發送到貨提醒
                        </button>
                    </td>
                    <td class="p-3">
                        <button onclick="deleteOrder(${order.id})" class="text-rose-600 hover:text-rose-800 text-xs font-medium">刪除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // 渲染評價
            renderReviews();

            // 寫入 LocalStorage
            localStorage.setItem('community_groupbuy_orders', JSON.stringify(orders));
        }

        // 送出訂單
        document.getElementById('orderForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            const time = document.getElementById('pickupTime').value;
            const notify = document.getElementById('notifyType').value;
            const hasAddon = document.getElementById('addOption').checked;

            const newOrder = {
                id: Date.now(),
                name: name,
                phone: phone,
                qty: currentQty,
                hasAddon: hasAddon,
                time: time,
                notify: notify,
                paid: false,
                picked: false
            };

            orders.push(newOrder);
            document.getElementById('orderForm').reset();
            currentQty = 1;
            document.getElementById('orderQty').innerText = currentQty;
            updateUI();
            alert('已成功登記跟團預購！');
        });

        // 新增評價
        function addReview(e) {
            e.preventDefault();
            const name = document.getElementById('reviewName').value;
            const rating = document.getElementById('reviewRating').value;
            const text = document.getElementById('reviewText').value;

            reviews.unshift({ name, rating, text });
            localStorage.setItem('community_groupbuy_reviews', JSON.stringify(reviews));
            document.getElementById('reviewForm').reset();
            renderReviews();
        }

        function renderReviews() {
            const list = document.getElementById('reviewsList');
            list.innerHTML = reviews.map(r => `
                <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 text-sm">
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-bold text-slate-800">${r.name}</span>
                        <span class="text-xs text-slate-500 font-semibold">評分：${r.rating} 顆星</span>
                    </div>
                    <p class="text-slate-600">${r.text}</p>
                </div>
            `).join('');
        }

        function toggleStatus(id, type) {
            orders = orders.map(order => order.id === id ? { ...order, [type]: !order[type] } : order);
            updateUI();
        }

        function sendArrivalNotice(name, notifyMethod) {
            alert(`【發送到貨提醒】\n已透過「${notifyMethod}」通知 ${name}：\n「您預購的社區團購商品已抵達管理室，請抽空前來領取！」`);
        }

        function deleteOrder(id) {
            if (confirm('確定要刪除這筆跟團紀錄嗎？')) {
                orders = orders.filter(order => order.id !== id);
                updateUI();
            }
        }

        function copyLineSummary() {
            let text = `【團購到貨通知與領貨清單】\n`;
            text += `取貨地點：社區管理室前\n`;
            text += `------------------------------\n`;
            
            orders.forEach(o => {
                const statusPaid = o.paid ? '已付' : '未付';
                const statusPicked = o.picked ? '已領' : '待領';
                text += `• ${o.name}：${o.qty}件 / [${statusPaid}] / [${statusPicked}]\n`;
            });

            text += `------------------------------\n請大家抽空前往領取，感謝合作！`;

            navigator.clipboard.writeText(text);
            alert('已成功複製格式化文字！可以直接貼到社區 LINE 群組發布通知。');
        }

        // 初始化
        updateUI();
    </script>
</body>
</html>
