<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社區美食團購</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-16">
    <!-- 頂部 Header -->
    <header class="bg-slate-800 text-white py-6 shadow-md">
        <div class="max-w-4xl mx-auto px-4 flex justify-between items-center">
            <div>
                <span class="bg-amber-500 text-slate-900 font-bold text-xs px-2.5 py-1 rounded">社區獨家回饋價</span>
                <h1 class="text-2xl sm:text-3xl font-bold mt-1 tracking-tight">社區美食團購</h1>
                <p class="text-slate-300 text-xs sm:text-sm mt-0.5">嚴選熱門排隊美食 ｜ 專屬社區免費直送 ｜ 取貨地點：社區管理室前</p>
            </div>
            <!-- 切換角色按鈕 -->
            <button onclick="toggleAdminView()" id="adminToggleBtn" class="bg-slate-700 hover:bg-slate-600 text-slate-100 text-xs px-3 py-2 rounded border border-slate-600 transition">
                團主登入
            </button>
        </div>
    </header>
    <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">
        <!-- 住戶跟團下單區 (前台) -->
        <section class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
            <h2 class="text-xl font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100">我要跟團預購</h2>
            <form id="orderForm" class="space-y-5">
                
                <!-- 住戶資料 -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">戶號 (棟別 / 樓層) *</label>
                        <div class="grid grid-cols-2 gap-2">
                            <select id="buildingSelect" class="border border-slate-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-slate-500 text-sm bg-white">
                                <option value="A棟">A棟</option>
                                <option value="B棟">B棟</option>
                                <option value="C棟">C棟</option>
                                <option value="D棟">D棟</option>
                                <option value="E棟">E棟</option>
                                <option value="F棟">F棟</option>
                            </select>
                            <select id="floorSelect" class="border border-slate-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-slate-500 text-sm bg-white">
                                <!-- JS動態生成1-24樓 -->
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">住戶姓名 *</label>
                        <input type="text" id="userName" required placeholder="例如：張先生" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-slate-500 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">聯絡電話 *</label>
                        <input type="tel" id="userPhone" required placeholder="請填10位數字 (例：0912345678)" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-slate-500 outline-none text-sm">
                    </div>
                </div>
                <!-- 複選多品項區 -->
                <div class="border-t border-slate-100 pt-4 space-y-4">
                    <label class="block text-sm font-semibold text-slate-700">選擇團購品項：</label>
                    <!-- [圖三修改] 社區嘉年華 競標得標解鎖品項 (輸入 BID-180 後顯示) -->
                    <div id="bidUnlockedBanner" class="hidden bg-amber-50 p-4 rounded-lg border-2 border-dashed border-amber-400 flex justify-between items-center">
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="bg-amber-500 text-white text-xs px-2 py-0.5 rounded font-bold">社區嘉年華 競標得標</span>
                                <p class="font-bold text-slate-800 text-base">限量大湖草莓起司塔 (1份)</p>
                            </div>
                            <p class="text-xs text-amber-800 mt-1">已驗證得標認領碼，此限量商品已自動鎖定加入您的訂單明細中。</p>
                        </div>
                        <span class="text-base font-extrabold text-amber-700 whitespace-nowrap ml-2">$180</span>
                    </div>
                    <!-- 品項 1：鬆軟日式貝果 (多口味同時選購) -->
                    <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="flex items-center space-x-2">
                                    <p class="font-bold text-slate-800 text-base">鬆軟日式貝果</p>
                                    <span class="bg-rose-100 text-rose-700 text-xs px-2 py-0.5 rounded font-bold">烘焙金獎肯定</span>
                                </div>
                                <p class="text-xs text-slate-500 mt-1 leading-relaxed">
                                    採用日本進口麵粉與 18 小時低溫湯種熟成工法，呈現極致鬆軟且具 Q 彈
